version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cdy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdy_password}
      POSTGRES_DB: ${POSTGRES_DB:-cdy_system}
    ports:
      - '5433:5432'
    volumes:
      - cdy_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cdy_user} -d ${POSTGRES_DB:-cdy_system}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cdy_network

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: production
    container_name: cdy_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cdy_user}:${POSTGRES_PASSWORD:-cdy_password}@postgres:5432/${POSTGRES_DB:-cdy_system}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-finance@cdy.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3250}
      NODE_ENV: production
      PORT: 3251
      UPLOAD_DIR: /app/uploads
      SENTRY_DSN: ${SENTRY_DSN:-}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      SEED_FORCE: ${SEED_FORCE:-false}
    ports:
      - '3251:3251'
    volumes:
      - cdy_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cdy_network

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: development
    container_name: cdy_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3251/api/v1}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-nextauth-secret}
      NODE_ENV: development
      PORT: 3250
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    ports:
      - '3250:3250'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
      - /app/apps/web/.next
    depends_on:
      - api
    command: sh -c "pnpm --filter @cdy/shared build && pnpm --filter web dev"
    networks:
      - cdy_network

  adminer:
    image: adminer:latest
    container_name: cdy_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    networks:
      - cdy_network

volumes:
  cdy_postgres_data:
    driver: local
  cdy_uploads:
    driver: local

networks:
  cdy_network:
    driver: bridge
