# STEP 1 — HTTP only (before TLS cert is ready).
# Host nginx proxies directly to Docker web + api on localhost.
#
#   sudo cp docker/nginx/host-nginx.http-only.example.conf /etc/nginx/sites-available/cdy-inhouse
#   sudo ln -sf /etc/nginx/sites-available/cdy-inhouse /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream cdy_web {
    server 127.0.0.1:3250;
    keepalive 32;
}

upstream cdy_api {
    server 127.0.0.1:3251;
    keepalive 32;
}

server {
    listen 80;
    server_name inhouse.cdyagency.com;

    location /health {
        access_log off;
        return 200 'CDY System OK';
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://cdy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://cdy_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
