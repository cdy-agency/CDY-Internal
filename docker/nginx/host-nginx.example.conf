# Example host nginx site for production.
# Install: sudo cp docker/nginx/host-nginx.example.conf /etc/nginx/sites-available/cdy-inhouse
#          sudo ln -s /etc/nginx/sites-available/cdy-inhouse /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Host nginx keeps :80 / :443. Docker nginx listens on 127.0.0.1:8081 only.

upstream cdy_docker_nginx {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name inhouse.cdyagency.com;

    ssl_certificate     /etc/letsencrypt/live/inhouse.cdyagency.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inhouse.cdyagency.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://cdy_docker_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name inhouse.cdyagency.com;
    return 301 https://$host$request_uri;
}
