  version: '3.9'

  services:
    postgres:
      image: postgres:15-alpine
      container_name: cdy_postgres_prod
      restart: always
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      volumes:
        - cdy_postgres_data_prod:/var/lib/postgresql/data
      healthcheck:
        test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - cdy_network

    api:
      build:
        context: .
        dockerfile: docker/api/Dockerfile
        target: production
      container_name: cdy_api_prod
      restart: always
      environment:
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        JWT_SECRET: ${JWT_SECRET}
        JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
        JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
        JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
        RESEND_API_KEY: ${RESEND_API_KEY}
        RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
        FRONTEND_URL: ${FRONTEND_URL}
        NODE_ENV: production
        PORT: 3251
        UPLOAD_DIR: /app/uploads
        SENTRY_DSN: ${SENTRY_DSN}
        SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
        SEED_FORCE: ${SEED_FORCE:-false}
      volumes:
        - cdy_uploads_prod:/app/uploads
      ports:
        - '3251:3251'
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - cdy_network

    web:
      build:
        context: .
        dockerfile: docker/web/Dockerfile
        target: production
      container_name: cdy_web_prod
      restart: always
      environment:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NODE_ENV: production
        PORT: 3250
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      ports:
        - '3250:3250'
      depends_on:
        - api
      networks:
        - cdy_network

  volumes:
    cdy_postgres_data_prod:
      driver: local
    cdy_uploads_prod:
      driver: local

  networks:
    cdy_network:
      driver: bridge
